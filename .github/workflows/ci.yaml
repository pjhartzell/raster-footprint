name: Continuous Integration

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - name: Sync environment
        run: uv sync --frozen --python ${{ matrix.python-version }}
      - name: Check with pre-commit
        run: uv run pre-commit run --all-files
      - name: Run tests
        run: uv run pytest

  min-dependencies:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - name: Install geos
        run: sudo apt-get install libgeos-dev
      - name: Sync environment
        run: uv sync --frozen --python 3.10
      - name: Install minimum versions of dependencies
        run: uv run scripts/install-min-dependencies
      - name: Check with pre-commit
        run: uv run pre-commit run --all-files
      - name: Run tests
        run: uv run pytest

  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - name: Sync environment with docs group
        run: uv sync --frozen --no-default-groups --group docs --python 3.13
      - name: Build docs
        run: uv run sphinx-build -W docs docs/_build/html
