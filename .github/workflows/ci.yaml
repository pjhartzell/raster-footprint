name: Continuous Integration

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install with dev dependencies
        run: uv pip install --system .[dev]
      - name: Check with pre-commit
        run: pre-commit run --all-files
      - name: Run tests
        run: pytest
  min-dependencies:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - name: Install geos
        run: sudo apt-get install libgeos-dev
      - name: Install with dev dependencies
        run: uv pip install --system .[dev]
      - name: Install minimum versions of dependencies
        run: scripts/install-min-dependencies
      - name: Check with pre-commit
        run: pre-commit run --all-files
      - name: Run tests
        run: pytest
  docs:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      - name: Install with docs dependencies
        run: uv pip install --system .[docs]
      - name: Check docs
        run: sphinx-build -W docs docs/_build/html
