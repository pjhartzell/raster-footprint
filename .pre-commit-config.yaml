# Configuration file for pre-commit (https://pre-commit.com/).
# Local hooks run against the dev environment installed by `uv sync`.
# Upstream hooks are used only for check-only / deterministic-trim
# helpers that don't have a Python equivalent and don't suffer from
# the formatter version-drift problem.
# Run `uv run pre-commit run --all-files` when adding or changing entries.

repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff-format
        entry: ruff format
        language: system
        types: [python]
      - id: codespell
        name: codespell
        entry: codespell
        language: system
        types_or: [markdown, python, shell]
      - id: mypy
        name: mypy
        entry: mypy
        language: system
        pass_filenames: false
        args: ["src/", "tests/"]
      - id: yamllint
        name: yamllint
        entry: yamllint
        language: system
        types: [yaml]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
