# Configuration file for pre-commit (https://pre-commit.com/).
# Hooks run against the dev environment installed by `uv sync`.
# Run `uv run pre-commit run --all-files` when adding or changing entries.

repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: ruff check --fix
        language: system
        types: [python]
      - id: black
        name: black
        entry: black
        language: system
        types: [python]
      - id: codespell
        name: codespell
        entry: codespell
        language: system
        types_or: [markdown, python, shell]
      - id: mypy
        name: mypy
        entry: mypy
        language: system
        pass_filenames: false
        args: ["src/", "tests/"]
